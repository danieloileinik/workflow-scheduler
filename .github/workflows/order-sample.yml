name: Order sample
on:
  push:
    branches: [ main ]
    paths: [ 'src/**', 'database/**', 'samples/**', '.github/workflows/order-sample.yml' ]
  pull_request:
    paths: [ 'src/**', 'database/**', 'samples/**', '.github/workflows/order-sample.yml' ]
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore samples/order-demo/OrderDemo.slnx
      - name: Build
        run: dotnet build samples/order-demo/OrderDemo.slnx --no-restore --configuration Release --warnaserror
      - name: Test business rules and PostgreSQL idempotency
        run: dotnet test samples/order-demo/OrderDemo.slnx --no-build --configuration Release
      - name: Start the complete sample
        run: docker compose -f samples/order-demo/compose.yaml up --build -d
      - name: Exercise orders, events, retries and compensation
        run: python3 samples/order-demo/scripts/smoke.py
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f samples/order-demo/compose.yaml logs --no-color
      - name: Clean up sample resources
        if: always()
        run: docker compose -f samples/order-demo/compose.yaml down --volumes
