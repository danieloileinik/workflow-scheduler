syntax = "proto3";

option csharp_namespace = "WorkflowScheduler.Grpc";

package workflow;

service GetProcessStatusService {
  rpc GetProcessStatus (GetProcessStatusRequest) returns (GetProcessStatusResponse);
}

message StepHistoryEntry {
  string id = 1;
  string step_definition_id = 2;
  string status = 3;
  string started_at = 4;
  string completed_at = 5;
  string output_data = 6;
  string error = 7;
  int32 retry_count = 8;
}

message GetProcessStatusRequest {
  string process_instance_id = 1;
  int32 history_offset = 2;
  int32 history_page_size = 3;
  bool omit_output_data = 4;
}

message GetProcessStatusResponse {
  string id = 1;
  string definition_id = 2;
  string business_key = 3;
  string status = 4;
  string current_step_id = 5;
  string created_at = 6;
  string updated_at = 7;
  repeated StepHistoryEntry step_history = 8;
  int32 total_step_count = 9;
  int32 history_offset = 10;
}
